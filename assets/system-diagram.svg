<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="700" rx="24" fill="url(#bg)"/>

  <text x="640" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">VeraFit AI — Purchase Certainty Engine</text>
  <text x="640" y="78" text-anchor="middle" font-size="15" fill="#94a3b8">Predict keep-vs-return before checkout · Multi-agent LangGraph · SSIM + CIELab math</text>

  <!-- LEFT: Client -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="240" height="500" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="120" width="240" height="44" rx="14" fill="#0f172a"/>
    <text x="160" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">Client</text>
    <rect x="62" y="184" width="196" height="56" rx="8" fill="#273449"/>
    <text x="160" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">React SPA (Vite)</text>
    <text x="160" y="226" text-anchor="middle" font-size="11" fill="#94a3b8">Fitting Room · Calendar · Admin</text>
    <rect x="62" y="256" width="196" height="56" rx="8" fill="#273449"/>
    <text x="160" y="279" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Demo Personas</text>
    <text x="160" y="298" text-anchor="middle" font-size="11" fill="#94a3b8">Shoppers + Merchant Admins</text>
    <rect x="62" y="328" width="196" height="56" rx="8" fill="#273449"/>
    <text x="160" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Zustand stores</text>
    <text x="160" y="370" text-anchor="middle" font-size="11" fill="#94a3b8">tryOnStore · authStore</text>
    <text x="160" y="560" text-anchor="middle" font-size="12" fill="#64748b">port 5193 (dev)</text>
  </g>

  <!-- MIDDLE: API gateway -->
  <g filter="url(#shadow)">
    <rect x="360" y="120" width="300" height="500" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="360" y="120" width="300" height="44" rx="14" fill="#0f172a"/>
    <text x="510" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">FastAPI Backend</text>
    <rect x="382" y="184" width="256" height="48" rx="8" fill="#273449"/>
    <text x="510" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">/api/v1 routers</text>
    <text x="510" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">analyze · garments · mannequin · feedback · history · insights · admin</text>
    <rect x="382" y="248" width="256" height="48" rx="8" fill="#273449"/>
    <text x="510" y="269" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">LangGraph orchestration</text>
    <text x="510" y="286" text-anchor="middle" font-size="11" fill="#94a3b8">5 agents run in parallel → synthesis</text>
    <rect x="382" y="312" width="256" height="56" rx="8" fill="#273449"/>
    <text x="510" y="333" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">Math engine</text>
    <text x="510" y="350" text-anchor="middle" font-size="11" fill="#94a3b8">SSIM variance + heatmap</text>
    <text x="510" y="366" text-anchor="middle" font-size="11" fill="#94a3b8">CIELab ΔE · palette match</text>
    <rect x="382" y="384" width="256" height="56" rx="8" fill="#273449"/>
    <text x="510" y="405" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">SQLAlchemy (async)</text>
    <text x="510" y="422" text-anchor="middle" font-size="11" fill="#94a3b8">SQLite · aiosqlite</text>
    <text x="510" y="560" text-anchor="middle" font-size="12" fill="#64748b">port 5194 · /health</text>
  </g>

  <!-- RIGHT: Agents -->
  <g filter="url(#shadow)">
    <rect x="740" y="120" width="500" height="500" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="740" y="120" width="500" height="44" rx="14" fill="#0f172a"/>
    <text x="990" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">Domain Agents &amp; Services</text>

    <rect x="762" y="184" width="222" height="52" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="873" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">VTO Agent</text>
    <text x="873" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">3 renders → SSIM stability</text>

    <rect x="996" y="184" width="222" height="52" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="1107" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">Color Agent</text>
    <text x="1107" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">seasonal harmony · ΔE</text>

    <rect x="762" y="252" width="222" height="52" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="873" y="273" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">Fabric Safety Agent</text>
    <text x="873" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">allergens · skin audit</text>

    <rect x="996" y="252" width="222" height="52" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="1107" y="273" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">Personalization Agent</text>
    <text x="1107" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">fit bias · mood modifier</text>

    <rect x="762" y="320" width="222" height="52" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <text x="873" y="341" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">Purchase History Agent</text>
    <text x="873" y="358" text-anchor="middle" font-size="11" fill="#94a3b8">learnings · score delta</text>

    <rect x="996" y="320" width="222" height="52" rx="8" fill="url(#accent)"/>
    <text x="1107" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Synthesis Agent</text>
    <text x="1107" y="358" text-anchor="middle" font-size="11" fill="#0f172a">keep_probability · verdict</text>

    <rect x="762" y="392" width="456" height="48" rx="8" fill="#273449"/>
    <text x="990" y="413" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">LiteLLM verdict → AI explanation</text>
    <text x="990" y="429" text-anchor="middle" font-size="11" fill="#94a3b8">gpt-4o / ollama/granite4.1:3b</text>

    <rect x="762" y="456" width="456" height="48" rx="8" fill="#273449"/>
    <text x="990" y="477" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e8f0">YouCam API (cloth-v4)</text>
    <text x="990" y="493" text-anchor="middle" font-size="11" fill="#94a3b8">garment VTO · mock fallback</text>
  </g>

  <!-- ARROWS -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Client -> API -->
  <path d="M 280 200 L 358 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">REST /api/v1</text>
  <!-- API -> Agents -->
  <path d="M 660 300 L 740 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="288" text-anchor="middle" font-size="11" fill="#94a3b8">GraphState</text>

  <!-- DB -->
  <g filter="url(#shadow)">
    <rect x="360" y="560" width="300" height="56" rx="10" fill="#273449" stroke="#475569"/>
    <text x="510" y="584" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">data/verafit.db</text>
    <text x="510" y="602" text-anchor="middle" font-size="11" fill="#94a3b8">User · Mannequin · Preferences · TryOn · Feedback · Garments</text>
  </g>

  <!-- bottom bar -->
  <rect x="360" y="120" width="300" height="2" fill="url(#accent)"/>
  <rect x="40" y="120" width="240" height="2" fill="url(#accent)"/>
  <rect x="740" y="120" width="500" height="2" fill="url(#accent)"/>

  <text x="640" y="680" text-anchor="middle" font-size="12" fill="#64748b">VeraFit AI · Docker single-container deploy (SPA + API) · scripts/deploy.sh → AWS ECS Fargate / EC2</text>
</svg>
